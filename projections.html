<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse du backlog — PS France</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F8F6; --surface: #FFFFFF; --border: #E8E6E0;
    --ink: #1A1A18; --muted: #6B6B67; --muted-2: #9B9B96;
    --litt: #185FA5; --geodp: #854F0B; --green: #3B6D11;
    --bad: #993C1D; --amber: #B5740F;
    --p1: #3B6D11; --p2: #6BA12E; --p3: #C99A2E; --p4: #185FA5;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 24px 40px; }
  .home-link { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 8px;
    color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
  .home-link:hover { background: var(--bg); color: var(--ink); }
  .eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; }
  h1 { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .photo-date { font-size: 12.5px; color: var(--muted-2); margin-top: 2px; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

  .section { margin-bottom: 32px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .section h2 { font-size: 16px; font-weight: 700; }
  .note { font-size: 12.5px; color: var(--muted-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

  .sol-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .sol-title .dot { width: 11px; height: 11px; border-radius: 3px; }
  .sol-litt .dot { background: var(--litt); }
  .sol-geodp .dot { background: var(--geodp); }

  .kpi-mini { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .kpi-mini .k { flex: 1; min-width: 90px; }
  .kpi-mini .kl { font-size: 11.5px; color: var(--muted); }
  .kpi-mini .kv { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi-mini .ks { font-size: 11px; color: var(--muted-2); }

  /* barre mobilisable / bloqué */
  .split-bar { display: flex; height: 30px; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 8px; }
  .split-seg { display: flex; align-items: center; justify-content: center; color: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .12s; }
  .split-seg:hover { opacity: .85; }

  /* barres par phase */
  .phase-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .phase-name { width: 150px; font-size: 12.5px; flex-shrink: 0; }
  .phase-track { flex: 1; height: 24px; background: var(--bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); display: flex; }
  .phase-fill { height: 100%; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity .12s; }
  .phase-fill:hover { opacity: .85; }
  /* Part bloquée : même couleur, motif hachuré pour la distinguer */
  .phase-bloque { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0, rgba(255,255,255,.35) 4px, transparent 4px, transparent 8px); opacity: .78; }
  .phase-legend { display: flex; gap: 16px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .pl-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .pl-sw { width: 20px; height: 11px; border-radius: 3px; }
  .pl-mob { background: var(--muted-2); }
  .pl-blo { background: var(--muted-2); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0, rgba(255,255,255,.5) 3px, transparent 3px, transparent 6px); }
  /* Échéancier de déblocage */
  .deb-track { display: flex; height: 30px; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); margin-top: 6px; }
  .deb-seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: opacity .12s; }
  .deb-seg:hover { opacity: .85; }
  .deb-legend { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .deb-leg { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .deb-leg .sw { width: 11px; height: 11px; border-radius: 3px; }
  .phase-amt { width: 78px; text-align: right; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* modèle de jalonnement */
  .jalon-flow { display: flex; gap: 0; flex-wrap: wrap; }
  .jalon-step { flex: 1; min-width: 200px; padding: 16px; border-radius: 10px; margin: 4px; color: #fff; position: relative; }
  .jalon-pct { font-family: 'DM Mono', monospace; font-size: 13px; opacity: .9; }
  .jalon-name { font-size: 15px; font-weight: 700; margin: 4px 0; }
  .jalon-resp { font-size: 11.5px; opacity: .9; font-weight: 600; margin-bottom: 8px; }
  .jalon-desc { font-size: 11.5px; opacity: .92; line-height: 1.4; }
  .jalon-note { background: #FBF3E5; border: 1px solid #E8D9BC; border-radius: 10px; padding: 14px 18px; margin-top: 14px; font-size: 13px; color: #6B5526; line-height: 1.5; }

  #tooltip { position: fixed; pointer-events: none; z-index: 100; background: var(--ink); color: #fff;
    padding: 8px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transition: opacity .12s; white-space: nowrap; }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-label { color: var(--muted-2); font-size: 11px; }
  #tooltip .tt-val { font-weight: 700; font-variant-numeric: tabular-nums; }
  footer { text-align: center; color: var(--muted-2); font-size: 12px; padding: 24px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted-2); }
</style>
</head>
<body>
<header>
  <a href="index.html" class="home-link">← Accueil</a>
  <div class="eyebrow">PS France · Analyse du backlog</div>
  <h1>Backlog facturable</h1>
  <div style="font-size:12px;color:var(--muted-2);margin-top:3px">Mise à jour le 24/08/2026 à 04:04</div>
  <div class="photo-date" id="photo"></div>
</header>
<main id="app"></main>
<div id="tooltip"></div>
<footer>Photo du backlog à la date d'extraction · recalculé à chaque mise à jour</footer>

<script>
const D = {"disponible": true, "photo": "2026-08-24", "litt": {"total": 166269.69, "mobilisable": 61355.14, "bloque": 104914.55, "nb": 93, "nb_mobilisable": 34, "nb_bloque": 59, "temps_total": 0.0, "temps_mobilisable": 0.0, "temps_bloque": 0.0, "par_phase": {"Lancement & prérequis": 32353.25, "Mise en service": 7460.1, "Paramétrage & recette": 116362.36, "PV signé": 10093.98}, "nb_par_phase": {"Lancement & prérequis": 16, "Mise en service": 3, "Paramétrage & recette": 61, "PV signé": 13}, "phase_mobilisable": {"Lancement & prérequis": 7695.0, "Mise en service": 0.0, "Paramétrage & recette": 48653.81, "PV signé": 5006.33}, "phase_bloque": {"Lancement & prérequis": 24658.25, "Mise en service": 7460.1, "Paramétrage & recette": 67708.55, "PV signé": 5087.65}, "par_blocage": {"Aucun": 61355.14, "Blocage client": 87499.28, "Blocage produit": 3507.9, "Blocage commerce": 11307.37, "Autre": 2600.0}, "nb_par_blocage": {"Aucun": 34, "Blocage client": 46, "Blocage produit": 5, "Blocage commerce": 6, "Autre": 2}, "deblocage_montant": {"Ce mois": 14520.19, "1-3 mois": 4101.87, "Au-delà": 2132.4, "Sans date": 84160.09}, "deblocage_nb": {"Ce mois": 13, "1-3 mois": 2, "Au-delà": 1, "Sans date": 43}}, "geodp": {"total": 209072.29, "mobilisable": 78689.13, "bloque": 130383.16, "nb": 79, "nb_mobilisable": 39, "nb_bloque": 40, "temps_total": 0.0, "temps_mobilisable": 0.0, "temps_bloque": 0.0, "par_phase": {"Lancement & prérequis": 46689.0, "Mise en service": 16668.0, "Paramétrage & recette": 140477.17, "PV signé": 5238.12}, "nb_par_phase": {"Lancement & prérequis": 18, "Mise en service": 3, "Paramétrage & recette": 42, "PV signé": 16}, "phase_mobilisable": {"Lancement & prérequis": 22474.0, "Mise en service": 1170.0, "Paramétrage & recette": 52336.67, "PV signé": 2708.46}, "phase_bloque": {"Lancement & prérequis": 24215.0, "Mise en service": 15498.0, "Paramétrage & recette": 88140.5, "PV signé": 2529.66}, "par_blocage": {"Aucun": 78689.13, "Blocage client": 61028.85, "Blocage produit": 22952.75, "Blocage commerce": 9871.35, "Autre": 36530.21}, "nb_par_blocage": {"Aucun": 39, "Blocage client": 27, "Blocage produit": 7, "Blocage commerce": 3, "Autre": 3}, "deblocage_montant": {"Ce mois": 59652.61, "1-3 mois": 8456.34, "Au-delà": 7262.41, "Sans date": 55011.8}, "deblocage_nb": {"Ce mois": 13, "1-3 mois": 5, "Au-delà": 4, "Sans date": 18}}, "phases": ["Lancement & prérequis", "Mise en service", "Paramétrage & recette", "PV signé"], "blocages": ["Aucun", "Blocage client", "Blocage produit", "Blocage commerce", "Autre"], "tranches_deb": ["Ce mois", "1-3 mois", "Au-delà", "Sans date"]};
const eur = n => Math.round(n).toLocaleString('fr-FR') + ' €';
const eurK = n => Math.round(n/1000) + 'k€';

if (!D.disponible) {
  document.getElementById('app').innerHTML =
    `<div class="empty-state">Données de backlog pas encore disponibles.<br>Elles seront générées au prochain passage du pipeline.</div>`;
} else {
  document.getElementById('photo').textContent = 'Photo au ' + D.photo;
}

const PHASE_COLORS = {
  'Lancement & prérequis': 'var(--p1)',
  'Mise en service': 'var(--p2)',
  'Paramétrage & recette': 'var(--p3)',
  'PV signé': 'var(--p4)',
};
const BLOC_COLORS = {
  'Aucun': 'var(--green)', 'Blocage client': 'var(--bad)',
  'Blocage produit': 'var(--amber)', 'Blocage commerce': '#7A5CA8', 'Autre': 'var(--muted-2)',
};

function composantesCard(name, cls, d) {
  const totMob = d.mobilisable, totBlo = d.bloque, tot = d.total || 1;
  const pMob = totMob/tot*100, pBlo = totBlo/tot*100;
  return `<div class="card sol-${cls}">
    <div class="sol-title sol-${cls}"><span class="dot"></span>${name}</div>
    <div class="kpi-mini">
      <div class="k"><div class="kl">Backlog total</div><div class="kv">${eurK(d.total)}</div><div class="ks">${d.nb} BDC</div></div>
      <div class="k"><div class="kl">Mobilisable</div><div class="kv" style="color:var(--green)">${eurK(d.mobilisable)}</div><div class="ks">${d.nb_mobilisable} BDC · ${Math.round(pMob)}%</div></div>
      <div class="k"><div class="kl">Bloqué</div><div class="kv" style="color:var(--bad)">${eurK(d.bloque)}</div><div class="ks">${d.nb_bloque} BDC · ${Math.round(pBlo)}%</div></div>
    </div>
    <div class="split-bar">
      <div class="split-seg" style="width:${pMob}%;background:var(--green)"
        data-tip="Mobilisable|${eur(d.mobilisable)} · ${d.nb_mobilisable} BDC">${pMob>12?'Mobilisable':''}</div>
      <div class="split-seg" style="width:${pBlo}%;background:var(--bad)"
        data-tip="Bloqué|${eur(d.bloque)} · ${d.nb_bloque} BDC">${pBlo>12?'Bloqué':''}</div>
    </div>
    <div class="note">Détail des blocages : ${D.blocages.filter(b=>b!=='Aucun'&&d.par_blocage[b]>0).map(b=>
      `${b.replace('Blocage ','')} ${eurK(d.par_blocage[b])}`).join(' · ') || 'aucun blocage'}</div>
  </div>`;
}

function phasesCard(name, cls, d) {
  const max = Math.max(...D.phases.map(p=>d.par_phase[p]), 1);
  let rows = '';
  for (const p of D.phases) {
    const v = d.par_phase[p], nb = d.nb_par_phase[p];
    const mob = (d.phase_mobilisable && d.phase_mobilisable[p]) || 0;
    const blo = (d.phase_bloque && d.phase_bloque[p]) || 0;
    const wMob = mob/max*100, wBlo = blo/max*100;
    rows += `<div class="phase-row">
      <span class="phase-name">${p}</span>
      <div class="phase-track">
        <div class="phase-fill" style="width:${wMob}%;background:${PHASE_COLORS[p]}"
          data-tip="${p} · mobilisable|${eur(mob)}"></div>
        <div class="phase-fill phase-bloque" style="width:${wBlo}%;background:${PHASE_COLORS[p]}"
          data-tip="${p} · bloqué|${eur(blo)}"></div>
      </div>
      <span class="phase-amt">${eurK(v)}</span>
    </div>`;
  }
  return `<div class="card sol-${cls}">
    <div class="sol-title sol-${cls}"><span class="dot"></span>${name}</div>
    ${rows}
    <div class="phase-legend">
      <span class="pl-item"><span class="pl-sw pl-mob"></span>Mobilisable</span>
      <span class="pl-item"><span class="pl-sw pl-blo"></span>Bloqué</span>
    </div>
  </div>`;
}

function render() {
  let html = '';

  /* 1. Composantes */
  html += `<div class="section"><div class="section-head">
    <h2>Composantes du backlog facturable</h2>
    <span class="note">mobilisable vs bloqué</span></div>
    <div class="grid-2">
      ${composantesCard('Littéralis','litt',D.litt)}
      ${composantesCard('GEODP','geodp',D.geodp)}
    </div></div>`;

  /* 2. Modèle de jalonnement */
  html += `<div class="section"><div class="section-head">
    <h2>En pratique : le modèle de jalonnement</h2></div>
    <div class="card">
      <p class="note" style="margin-bottom:14px">La reconnaissance du CA suit ce séquencement, dont aucune étape ne peut être évitée.</p>
      <div class="jalon-flow">
        <div class="jalon-step" style="background:var(--p1)">
          <div class="jalon-pct">0 → 10%</div>
          <div class="jalon-name">Lancement & prérequis</div>
          <div class="jalon-resp">CP</div>
          <div class="jalon-desc">Planification & réalisation du lancement. Récupération des prérequis indispensables à la mise en service.</div>
        </div>
        <div class="jalon-step" style="background:var(--p2)">
          <div class="jalon-pct">10 → 20%</div>
          <div class="jalon-name">Mise en service</div>
          <div class="jalon-resp">SYS + CP</div>
          <div class="jalon-desc">Mise en service de la solution par l'équipe système.</div>
        </div>
        <div class="jalon-step" style="background:var(--p3)">
          <div class="jalon-pct">20 → 90%</div>
          <div class="jalon-name">Paramétrage & recette</div>
          <div class="jalon-resp">CD + client</div>
          <div class="jalon-desc">Paramétrage par le chargé de déploiement. Accompagnement à la recette à hauteur de 30% du temps vendu.</div>
        </div>
        <div class="jalon-step" style="background:var(--p4)">
          <div class="jalon-pct">90 → 100%</div>
          <div class="jalon-name">PV signé</div>
          <div class="jalon-resp">client</div>
          <div class="jalon-desc">Envoi du PV, relances si nécessaire. Signature par le client.</div>
        </div>
      </div>
      <div class="jalon-note">
        <strong>La phase de recette est par nature incompressible.</strong>
        Les phases 20→90% (recette) et 90→100% (PV) dépendent des retours et de la disponibilité du client.
        C'est la temporalité et le jalonnement — plus que la capacité — qui déterminent le rythme d'écoulement du backlog.
      </div>
    </div></div>`;

  /* 3. Répartition par phase */
  html += `<div class="section"><div class="section-head">
    <h2>Répartition du backlog par phase</h2>
    <span class="note">mobilisable vs bloqué, par phase</span></div>
    <div class="grid-2">
      ${phasesCard('Littéralis','litt',D.litt)}
      ${phasesCard('GEODP','geodp',D.geodp)}
    </div></div>`;

  /* 4. Échéancier de déblocage */
  html += renderEcheancier();

  document.getElementById('app').innerHTML = html;
}

function renderEcheancier() {
  const TR = D.tranches_deb || ["Ce mois", "1-3 mois", "Au-delà", "Sans date"];
  const TR_COLORS = {
    "Ce mois": "#3B6D11", "1-3 mois": "#6BA12E",
    "Au-delà": "#C99A2E", "Sans date": "#9B9B96",
  };
  function ligne(name, cls, d) {
    const dm = d.deblocage_montant || {}, dn = d.deblocage_nb || {};
    const totBloque = TR.reduce((s,t)=>s+(dm[t]||0),0);
    if (totBloque <= 0) return '';
    const avecDate = TR.filter(t=>t!=='Sans date').reduce((s,t)=>s+(dm[t]||0),0);
    const pctPilote = Math.round(avecDate/totBloque*100);
    let segs = '';
    for (const t of TR) {
      const v = dm[t]||0, nb = dn[t]||0;
      if (v<=0) continue;
      const w = v/totBloque*100;
      segs += `<div class="deb-seg" style="width:${w}%;background:${TR_COLORS[t]}"
        data-tip="${t}|${eur(v)} · ${nb} BDC">${w>10?nb:''}</div>`;
    }
    return `<div class="card sol-${cls}">
      <div class="sol-title sol-${cls}"><span class="dot"></span>${name}
        <span style="font-weight:400;color:var(--muted);font-size:12px;margin-left:auto">
          ${eurK(totBloque)} bloqués · ${pctPilote}% avec échéance</span></div>
      <div class="deb-track">${segs}</div>
      <div class="deb-legend">
        ${TR.map(t=>`<span class="deb-leg"><span class="sw" style="background:${TR_COLORS[t]}"></span>${t}</span>`).join('')}
      </div>
    </div>`;
  }
  return `<div class="section"><div class="section-head">
    <h2>Échéancier de déblocage</h2>
    <span class="note">quand se lèvent les blocages actuels</span></div>
    <div class="grid-2">
      ${ligne('Littéralis','litt',D.litt)}
      ${ligne('GEODP','geodp',D.geodp)}
    </div>
    <div class="jalon-note" style="margin-top:14px">
      <strong>Une large part du backlog bloqué n'a pas d'échéance de déblocage estimée.</strong>
      C'est le reflet direct de notre <strong>dépendance aux clients</strong> : pour de nombreux projets,
      la date de reprise ne dépend pas de nous mais de la disponibilité et de la réactivité du client.
      Cet échéancier montre la levée des blocages <em>connus à ce jour</em> ; de nouveaux blocages peuvent
      apparaître d'ici là, et les projets « sans date » se débloqueront au gré des retours clients.
    </div></div>`;
}

if (D.disponible) render();

/* ── Infobulle interactive ── */
(function(){
  const tip = document.getElementById('tooltip');
  const app = document.getElementById('app');
  app.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    const [label, val] = el.getAttribute('data-tip').split('|');
    tip.innerHTML = `<div class="tt-label">${label}</div><div class="tt-val">${val}</div>`;
    tip.classList.add('show');
  });
  app.addEventListener('mousemove', e => {
    if (!tip.classList.contains('show')) return;
    let x = e.clientX + 14, y = e.clientY + 14;
    const r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth) x = e.clientX - r.width - 14;
    if (y + r.height > window.innerHeight) y = e.clientY - r.height - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  app.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) tip.classList.remove('show');
  });
})();
</script>
</body>
</html>
