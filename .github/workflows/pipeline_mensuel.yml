# ══════════════════════════════════════════════════════════════════
# Pipeline KPI — orchestration temporelle
# ══════════════════════════════════════════════════════════════════
# CHAQUE JOUR      : collecte → contrôle CA → export → historique → dashboard
#                    (sur le MOIS COURANT ; photo backlog figée au 1er passage)
# 1er JOUR DU MOIS : EN PLUS → fige le mois PRÉCÉDENT (mode precedent)
#                    + capture le PRÉVISIONNEL du mois qui commence
#
# Données sensibles (absences, cache) : jamais commitées (Secret + gitignore).
# ══════════════════════════════════════════════════════════════════

name: Pipeline mensuel

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à réaliser'
        required: false
        default: 'mois_courant'
        type: choice
        options:
          - mois_courant      # run normal (défaut, appelé par cron-job.org)
          - figer_precedent   # MANUEL : figer le mois précédent (clôture)
          - terminer_bascule  # MANUEL : lever le verrou, le mois courant reprend
  # Le déclenchement quotidien (7h et 12h, heure de Paris) est assuré par un
  # service externe (cron-job.org) qui appelle l'API workflow_dispatch avec
  # l'action "mois_courant". Les schedule: cron de GitHub Actions ont été retirés
  # (trop peu fiables : retards de plusieurs heures sur les comptes gratuits).
  #
  # BASCULE MENSUELLE (voir PROCESS_BASCULE.md) :
  #   - Le 1er du mois, le verrou se pose tout seul → le mois courant se met en pause.
  #   - Clôture : ajustements Jira → "figer_precedent" (manuel) → remise à zéro Jira.
  #   - Puis "terminer_bascule" (manuel) → le mois courant reprend.

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # ── Gestion du verrou de bascule ──
      # Si action = terminer_bascule : on lève le verrou (le mois courant reprend).
      # Sinon : orchestration normale (pose le verrou le 1er, levée auto à 10j).
      - name: Orchestration (verrou de bascule)
        id: orch
        run: |
          if [ "${{ github.event.inputs.action }}" = "terminer_bascule" ]; then
            python orchestration.py --lever
          else
            python orchestration.py
          fi

      - name: Restaurer absences_2026.xlsx
        env:
          ABSENCES_B64: ${{ secrets.ABSENCES_B64 }}
        run: |
          if [ -n "$ABSENCES_B64" ]; then
            echo "$ABSENCES_B64" | base64 -d > absences_2026.xlsx
            echo "✅ absences restaurées"
          else
            echo "⚠️ Secret ABSENCES_B64 absent"
          fi

      # ════════════════════════════════════════════════════════════
      # FIGER LE MOIS PRÉCÉDENT — MANUEL UNIQUEMENT (action figer_precedent)
      # À lancer pendant la bascule, après les ajustements Jira, AVANT la RAZ.
      # ════════════════════════════════════════════════════════════
      - name: "[Manuel] Figer le mois précédent"
        if: github.event.inputs.action == 'figer_precedent'
        env:
          JIRA_URL:       ${{ secrets.JIRA_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEMPO_TOKEN:    ${{ secrets.TEMPO_TOKEN }}
        run: |
          echo "── Figement MANUEL du mois précédent ──"
          python collect_jira_worklogs.py --mois precedent --refresh
          python export_mensuel.py
          python archiver_mois.py
          rm -f jira_cache.pkl

      # ════════════════════════════════════════════════════════════
      # MOIS COURANT — sauf si une bascule est en cours (verrou posé)
      # et sauf si l'action manuelle est figer_precedent.
      # ════════════════════════════════════════════════════════════
      - name: Collecter (mois courant)
        if: steps.orch.outputs.bascule_en_cours != 'true' && github.event.inputs.action != 'figer_precedent'
        env:
          JIRA_URL:       ${{ secrets.JIRA_URL }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TEMPO_TOKEN:    ${{ secrets.TEMPO_TOKEN }}
        run: python collect_jira_worklogs.py --mois courant --refresh

      - name: Contrôle de cohérence CA
        if: steps.orch.outputs.bascule_en_cours != 'true' && github.event.inputs.action != 'figer_precedent'
        continue-on-error: true
        run: python controle_coherence_ca.py

      - name: Générer l'export + historique
        if: steps.orch.outputs.bascule_en_cours != 'true' && github.event.inputs.action != 'figer_precedent'
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
        run: python export_mensuel.py

      # ── À la fin de bascule (terminer_bascule) : capturer le prévisionnel
      #    du nouveau mois qui démarre (après la RAZ Jira). ──
      - name: "[Fin de bascule] Capturer le prévisionnel"
        if: github.event.inputs.action == 'terminer_bascule'
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
        run: python generate_previsionnel.py

      - name: Générer le dashboard
        run: python generate_dashboard_mensuel.py

      - name: Générer le dashboard des objectifs
        run: python generate_objectifs.py

      - name: Générer le pilotage annuel
        run: python generate_pilotage.py

      - name: Générer l'analyse du backlog
        run: python generate_projections.py

      - name: Horodatage de mise à jour
        run: python -c "from horodatage import ecrire_fichier_maj; ecrire_fichier_maj()"

      # ── Nettoyer les fichiers sensibles AVANT publication ──
      - name: Supprimer les fichiers sensibles
        if: always()
        run: |
          rm -f jira_cache.pkl absences_2026.xlsx
          echo "🧹 fichiers sensibles supprimés"

      # ── Publier les livrables non sensibles ──
      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Mettre de côté TOUTES nos modifications générées (sans lister de
          # fichiers, pour éviter les erreurs sur un fichier absent comme le
          # prévisionnel qui n'existe qu'au 1er jour ouvré).
          git stash push --include-untracked 2>/dev/null || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git stash pop 2>/dev/null || true

          # Ajouter uniquement les livrables présents (|| true par fichier).
          for f in dashboard_mensuel.html objectifs.html pilotage.html projections.html index.html \
                   _historique.xlsx previsionnel_2026.xlsx derniere_maj.txt; do
            [ -f "$f" ] && git add "$f" || true
          done
          # Le verrou de bascule : géré explicitement APRÈS le pull, car le
          # stash/pull/pop peut restaurer le fichier depuis la version distante.
          # - Si l'orchestration l'a supprimé (fin de bascule) → on force sa suppression.
          # - Si l'orchestration l'a créé/maintenu (bascule en cours) → on l'ajoute.
          if [ "${{ steps.orch.outputs.bascule_en_cours }}" = "true" ]; then
            git add bascule_en_cours.flag 2>/dev/null || true
          else
            git rm --cached bascule_en_cours.flag 2>/dev/null || true
            rm -f bascule_en_cours.flag
          fi
          # Les archives mensuelles (exports figés, nommés AAAA-MM_Mois.xlsx).
          git add archives_mensuelles/*.xlsx 2>/dev/null || true
          git add jira_export_*.xlsx 2>/dev/null || true

          echo "── Fichiers en attente de commit ──"
          git status --short

          if git diff --staged --quiet; then
            echo "⚠️ Rien à publier — fichiers générés identiques au dépôt."
          else
            git commit -m "MAJ pipeline $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ Publié."
          fi
