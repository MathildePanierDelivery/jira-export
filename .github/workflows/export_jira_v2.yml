name: Export Jira quotidien

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Lundi-vendredi à 7h UTC (8h ou 9h heure française selon DST)
  workflow_dispatch:         # Permet aussi de lancer manuellement depuis GitHub

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'export Jira
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python Export_Jira_global_v2.py

      - name: Générer le dashboard global
        run: python Rapport_global.py

      - name: Générer le dashboard objectifs
        run: python generate_dashboard.py

      - name: Committer et pousser tous les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx" "*.html"
          git diff --cached --quiet || git commit -m "Export Jira + dashboards du $(date +'%Y-%m-%d')"
          git push
