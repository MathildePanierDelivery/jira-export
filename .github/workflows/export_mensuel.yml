name: Export mensuel

on:
  schedule:
    - cron: '0 8 1 * *'  # Le 1er de chaque mois à 8h UTC (après l'export quotidien)
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mise à jour reconnaissance CA
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python maj_reconnaissance_ca.py

      - name: Extraction temps Clockwork
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python extract_clockwork_times.py

      - name: Archiver les fichiers mensuels
        run: |
          python3 - << 'PYEOF'
          import glob, shutil, os
          from datetime import date
          today = date.today()
          # Le 1er du mois → on archive pour le mois précédent
          m = today.month - 1 if today.month > 1 else 12
          y = today.year if today.month > 1 else today.year - 1
          prefix = f"{y}-{m:02d}"
          mois_fr = ["Janvier","Février","Mars","Avril","Mai","Juin",
                     "Juillet","Août","Septembre","Octobre","Novembre","Décembre"]
          nom_mois = mois_fr[m - 1]
          os.makedirs("archives", exist_ok=True)
          for pattern, label in [
              ("RAR_Mensuel_*.xlsx",         f"{prefix}_RAR_{nom_mois}.xlsx"),
              ("Temps_Clockwork_*.xlsx",     f"{prefix}_clockwork_{nom_mois}.xlsx"),
              ("Reconnaissance_CA_*.xlsx",   f"{prefix}_reconnaissance_CA_{nom_mois}.xlsx"),
          ]:
              files = sorted(glob.glob(pattern), reverse=True)
              if files:
                  dest = f"archives/{label}"
                  shutil.copy2(files[0], dest)
                  print(f"✅ {dest}")
          PYEOF

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx" "archives/"
          git diff --cached --quiet || git commit -m "Export mensuel $(date +'%Y-%m')"
          git push
