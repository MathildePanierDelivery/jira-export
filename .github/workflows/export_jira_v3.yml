name: Export Jira quotidien

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Lundi-vendredi à 7h UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'export Jira
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python Export_Jira_global_v2.py

      - name: Générer le dashboard global
        run: python Rapport_global.py

      - name: Générer le dashboard objectifs
        run: python generate_dashboard.py

      - name: Archivage prévisionnel et final
        run: |
          python3 - << 'EOF'
          import os, glob, shutil
          from datetime import date, timedelta
          import calendar

          today = date.today()
          y, m = today.year, today.month

          # ── Trouver le fichier export du jour ──
          files = sorted(glob.glob("jira_export_*.xlsx"), reverse=True)
          if not files:
              print("Aucun fichier jira_export_*.xlsx trouvé, archivage ignoré.")
              exit(0)
          latest = files[0]
          prefix = f"{y}-{m:02d}"

          os.makedirs("archives", exist_ok=True)

          # ── Premier vendredi du mois → _previsionnel ──
          # Trouver le premier vendredi du mois courant
          first_day = date(y, m, 1)
          # weekday() : lundi=0, vendredi=4
          days_until_friday = (4 - first_day.weekday()) % 7
          first_friday = first_day + timedelta(days=days_until_friday)

          if today == first_friday:
              dest = f"archives/{prefix}_previsionnel.xlsx"
              shutil.copy2(latest, dest)
              print(f"✅ Archivage prévisionnel : {dest}")

          # ── Dernier jour ouvré du mois → _final ──
          # Dernier jour du mois
          last_day_num = calendar.monthrange(y, m)[1]
          last_day = date(y, m, last_day_num)
          # Reculer jusqu'au dernier lundi-vendredi
          while last_day.weekday() > 4:  # 5=sam, 6=dim
              last_day -= timedelta(days=1)

          if today == last_day:
              dest = f"archives/{prefix}_final.xlsx"
              shutil.copy2(latest, dest)
              print(f"✅ Archivage final : {dest}")

          if today != first_friday and today != last_day:
              print(f"ℹ️  Aujourd'hui ({today}) : pas d'archivage particulier.")
              print(f"   Premier vendredi du mois : {first_friday}")
              print(f"   Dernier jour ouvré du mois : {last_day}")
          EOF

      - name: Committer et pousser tous les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx" "*.html" "archives/"
          git diff --cached --quiet || git commit -m "Export Jira + dashboards du $(date +'%Y-%m-%d')"
          git push
