name: Export temps collaborateurs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Période à extraire'
        required: true
        default: 'mois_precedent'
        type: choice
        options:
          - mois_courant
          - mois_precedent

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Extraction temps par collaborateur
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          EXPORT_MODE: ${{ inputs.mode }}
        run: python export_temps_collab.py

      - name: Archiver le fichier produit
        env:
          EXPORT_MODE: ${{ inputs.mode }}
        run: |
          python3 - << 'PYEOF'
          import glob, shutil, os
          from datetime import date
          today = date.today()
          mode = os.environ.get("EXPORT_MODE", "mois_precedent")
          if mode == "mois_precedent":
              m = today.month - 1 if today.month > 1 else 12
              y = today.year if today.month > 1 else today.year - 1
          else:
              m, y = today.month, today.year
          prefix = f"{y}-{m:02d}"
          mois_fr = ["Janvier","Février","Mars","Avril","Mai","Juin",
                     "Juillet","Août","Septembre","Octobre","Novembre","Décembre"]
          nom_mois = mois_fr[m - 1]
          os.makedirs("archives", exist_ok=True)
          files = sorted(glob.glob("analyse_temps_*.xlsx"), reverse=True)
          if files:
              dest = f"archives/{prefix}_tps_collab_{nom_mois}.xlsx"
              shutil.copy2(files[0], dest)
              print(f"✅ {dest}")
          PYEOF

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx"
          [ -d "archives" ] && git add "archives/" || true
          git diff --cached --quiet || git commit -m "Temps collaborateurs $(date +'%Y-%m') [${{ inputs.mode }}]"
          git push
