<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilotage annuel — PS France</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F8F6; --surface: #FFFFFF; --border: #E8E6E0;
    --ink: #1A1A18; --muted: #6B6B67; --muted-2: #9B9B96;
    --litt: #185FA5; --geodp: #854F0B; --green: #3B6D11;
    --prod: #185FA5; --support: #C99A2E; --interne: #9B9B96;
    --bad: #993C1D; --amber: #B5740F;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 24px 40px;
  }
  .home-link {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 8px;
    color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  }
  .home-link:hover { background: var(--bg); color: var(--ink); }
  .eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-2); font-weight: 600; }
  h1 { font-size: 18px; font-weight: 600; margin-top: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }

  .section { margin-bottom: 30px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .section h2 { font-size: 16px; font-weight: 700; }
  .note { font-size: 12.5px; color: var(--muted-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
  .legend-item .sw { width: 12px; height: 12px; border-radius: 3px; }
  .legend-item .ln { width: 16px; height: 3px; border-radius: 2px; }

  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .kpi { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-2); }
  tbody tr:hover { background: var(--bg); }
  .rapport-high { color: var(--bad); font-weight: 600; }
  .rapport-low { color: var(--green); font-weight: 600; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .axis-label { font-size: 10px; fill: var(--muted-2); }
  [data-tip] { cursor: pointer; transition: opacity .12s; }
  [data-tip]:hover { opacity: 0.82; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 100;
    background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    opacity: 0; transition: opacity .12s; max-width: 260px; white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-label { color: var(--muted-2); font-size: 11px; }
  #tooltip .tt-val { font-weight: 700; font-variant-numeric: tabular-nums; }
  footer { text-align: center; color: var(--muted-2); font-size: 12px; padding: 24px; }
</style>
</head>
<body>
<header>
  <a href="index.html" class="home-link">← Accueil</a>
  <div class="eyebrow">PS France · Pilotage de production</div>
  <h1>Pilotage annuel <span id="year" style="color:var(--muted)"></span></h1>
  <div style="font-size:12px;color:var(--muted-2);margin-top:3px">Mise à jour le 30/08/2026 à 12:03</div>
</header>
<main id="app"></main>
<div id="tooltip"></div>
<footer>Tendances issues de l'historique · données agrégées</footer>

<script>
const D = {"mois": ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août"], "ca": {"global": [71232.501, 101509.39, 96018.39, 61719.0, 71773.36, 81371.444, 82891.49299999999, 32319.942], "litt": [29671.556, 69032.08, 44313.64, 26399.0, 41388.74, 31324.081, 31951.713, 14104.092], "geodp": [41560.945, 32477.31, 51704.75, 35320.0, 30384.62, 50047.363, 50939.78, 18215.85], "obj": [140830.0, 107440.0, 104660.0, 104280.0, 91630.0, 90000.0, 95000.0, 50000.0], "n1": [79000.0, 119099.14, 132206.23, 137638.77, 105643.94, 128013.0, 75234.88, 32317.92]}, "commandes": [152204.0, 56033.0, 99299.05, 50973.0, 59433.5, 130497.0, 40484.0, 22197.5], "rapport": [2.14, 0.55, 1.03, 0.83, 0.83, 1.6, 0.49, 0.69], "rapport_cum": [2.14, 1.21, 1.14, 1.08, 1.04, 1.13, 1.04, 1.02], "charge": {"prod": [351.0, 583.5799999999999, 690.4200000000001, 567.9200000000001, 347.0, 514.25, 379.75, 254.25], "support": [69.75, 82.4, 109.5, 84.75, 49.5, 133.5, 100.75, 91.0], "interne": [172.25, 190.25, 208.42, 223.25, 145.33, 173.25, 159.8333333333333, 214.0]}, "backlog": [443000.0, 382854.846, 391204.508, 376234.886, 360955.231, 376430.8809999999, 394518.787, 366960.294], "clotures": {"projets": [34, 28, 47, 48, 33, 21, 18, 8], "rework": [26, 11, 19, 17, 7, 6, 3, 2]}, "clotures_mois": ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août"], "annee": 2026};
document.getElementById('year').textContent = D.annee;

const eur = n => Math.round(n).toLocaleString('fr-FR') + ' €';
const eurK = n => Math.round(n/1000) + 'k€';

/* ── Échelle « jolie » adaptative selon l'ordre de grandeur ── */
function niceCeil(max) {
  if (max <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(max)));
  // paliers plus fins pour éviter les échelles trop lâches
  for (const step of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
    if (max <= step * pow) return step * pow;
  }
  return 10 * pow;
}

/* ── Graphe en barres EMPILÉES verticales ── */
function stackedChart(labels, series, opts={}) {
  const W = 1000, H = 280, padL = 50, padR = 20, padT = 20, padB = 36;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  // total empilé par mois
  const totals = labels.map((_, i) => series.reduce((sum, s) => sum + (s.values[i]||0), 0));
  const max = Math.max(...totals, 1);
  const niceMax = niceCeil(max);
  const n = labels.length;
  const groupW = innerW / n;
  const barW = Math.min(groupW * 0.5, 48);

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + innerH * i / 4;
    const val = niceMax * (1 - i/4);
    g += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    g += `<text class="axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${opts.fmt?opts.fmt(val):Math.round(val)}</text>`;
  }
  labels.forEach((lab, i) => {
    const cx = padL + groupW * i + groupW/2;
    let yBase = padT + innerH;  // bas de la barre
    const total = totals[i];
    series.forEach(s => {
      const v = s.values[i] || 0;
      if (v <= 0) return;
      const h = v / niceMax * innerH;
      yBase -= h;
      g += `<rect x="${cx - barW/2}" y="${yBase}" width="${barW}" height="${h}" fill="${s.color}"
        data-tip="${lab} · ${s.name}|${opts.tip?opts.tip(v):Math.round(v)}"/>`;
    });
    // total au-dessus de la barre
    g += `<text class="axis-label" x="${cx}" y="${padT+innerH - total/niceMax*innerH - 5}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${opts.tip?opts.tip(total):Math.round(total)}</text>`;
    g += `<text class="axis-label" x="${cx}" y="${H-padB+16}" text-anchor="middle">${lab.slice(0,3)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ── Graphe en barres groupées (ou simples) ── */
function barChart(labels, series, opts={}) {
  const W = 1000, H = 280, padL = 50, padR = 20, padT = 20, padB = 36;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(...allVals, 1);
  const niceMax = niceCeil(max);
  const n = labels.length, groups = series.length;
  const groupW = innerW / n;
  const barW = Math.min(groupW / (groups + 1), 40);

  let g = '';
  // grille horizontale + labels Y
  for (let i = 0; i <= 4; i++) {
    const y = padT + innerH * i / 4;
    const val = niceMax * (1 - i/4);
    g += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    g += `<text class="axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${opts.fmt?opts.fmt(val):Math.round(val)}</text>`;
  }
  // barres
  labels.forEach((lab, i) => {
    const cx = padL + groupW * i + groupW/2;
    series.forEach((s, j) => {
      const v = s.values[i] || 0;
      const h = v / niceMax * innerH;
      const x = cx - (groups*barW)/2 + j*barW;
      g += `<rect x="${x}" y="${padT+innerH-h}" width="${barW-2}" height="${h}" fill="${s.color}" rx="2"
        data-tip="${lab} · ${s.name}|${opts.tip?opts.tip(v):Math.round(v)}"/>`;
    });
    g += `<text class="axis-label" x="${cx}" y="${H-padB+16}" text-anchor="middle">${lab.slice(0,3)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ── Graphe en courbes ── */
function lineChart(labels, series, opts={}) {
  const W = 1000, H = 280, padL = 50, padR = 20, padT = 20, padB = 36;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(...allVals, 1);
  const niceMax = niceCeil(max) || 1;
  const n = labels.length;
  const xStep = n > 1 ? innerW / (n-1) : 0;
  const xAt = i => padL + xStep * i;
  const yAt = v => padT + innerH - (v / niceMax * innerH);

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + innerH * i / 4;
    const val = niceMax * (1 - i/4);
    g += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    g += `<text class="axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${opts.fmt?opts.fmt(val):Math.round(val)}</text>`;
  }
  labels.forEach((lab, i) => {
    g += `<text class="axis-label" x="${xAt(i)}" y="${H-padB+16}" text-anchor="middle">${lab.slice(0,3)}</text>`;
  });
  series.forEach(s => {
    const pts = s.values.map((v,i) => `${xAt(i)},${yAt(v)}`).join(' ');
    const dash = s.dashed ? 'stroke-dasharray="5,4"' : '';
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" ${dash}
      stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i) => {
      g += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="5" fill="${s.color}"
        data-tip="${labels[i]} · ${s.name}|${opts.tip?opts.tip(v):Math.round(v)}"/>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function legend(items) {
  return `<div class="legend">` + items.map(it =>
    `<span class="legend-item">${it.line?`<span class="ln" style="background:${it.color}"></span>`:`<span class="sw" style="background:${it.color}"></span>`}${it.name}</span>`
  ).join('') + `</div>`;
}

function render() {
  const m = D.mois;
  let html = '';

  /* 1. CA mensuel */
  html += `<div class="section"><div class="section-head">
    <h2>Chiffre d'affaires mensuel</h2><span class="note">réalisé vs objectif vs PY</span></div>
    <div class="card">
      ${legend([{name:'Réalisé',color:'var(--litt)',line:1},{name:'Objectif',color:'var(--amber)',line:1},{name:'PY',color:'var(--muted-2)',line:1}])}
      ${lineChart(m, [
        {name:'Réalisé', values:D.ca.global, color:'var(--litt)'},
        {name:'Objectif', values:D.ca.obj, color:'var(--amber)', dashed:true},
        {name:'PY', values:D.ca.n1, color:'var(--muted-2)', dashed:true},
      ], {fmt:eurK, tip:eur})}
    </div></div>`;

  /* 1b. CA par solution */
  html += `<div class="section"><div class="section-head">
    <h2>CA par solution</h2><span class="note">Littéralis vs GEODP</span></div>
    <div class="card">
      ${legend([{name:'Littéralis',color:'var(--litt)'},{name:'GEODP',color:'var(--geodp)'}])}
      ${barChart(m, [
        {name:'Littéralis', values:D.ca.litt, color:'var(--litt)'},
        {name:'GEODP', values:D.ca.geodp, color:'var(--geodp)'},
      ], {fmt:eurK, tip:eur})}
    </div></div>`;

  /* 2. Commandes vs CA déclaré + rapport */
  const totCmd = D.commandes.reduce((a,b)=>a+b,0);
  const totCA = D.ca.global.reduce((a,b)=>a+b,0);
  const rapportGlobal = totCA>0 ? (totCmd/totCA).toFixed(2) : '—';
  html += `<div class="section"><div class="section-head">
    <h2>Commandes reçues vs CA déclaré</h2><span class="note">flux entrant vs flux consommé</span></div>
    <div class="card">
      <div class="kpi-row">
        <div class="kpi"><div class="l">Total commandes ${D.annee}</div><div class="v">${eurK(totCmd)}</div></div>
        <div class="kpi"><div class="l">Total CA déclaré ${D.annee}</div><div class="v">${eurK(totCA)}</div></div>
        <div class="kpi"><div class="l">Rapport cumulé</div><div class="v" style="color:${rapportGlobal>1?'var(--bad)':'var(--green)'}">${rapportGlobal}</div></div>
      </div>
      ${legend([{name:'Commandes reçues',color:'var(--geodp)'},{name:'CA déclaré',color:'var(--litt)'}])}
      ${barChart(m, [
        {name:'Commandes', values:D.commandes, color:'var(--geodp)'},
        {name:'CA déclaré', values:D.ca.global, color:'var(--litt)'},
      ], {fmt:eurK, tip:eur})}
      <p class="note" style="margin-top:12px">Rapport > 1 : les commandes entrantes dépassent le CA déclaré (le backlog grossit). Rapport < 1 : on résorbe le backlog.</p>
    </div></div>`;

  /* 3. Charge mensuelle */
  html += `<div class="section"><div class="section-head">
    <h2>Charge mensuelle</h2><span class="note">heures productif / support / interne</span></div>
    <div class="card">
      ${legend([{name:'Productif',color:'var(--prod)'},{name:'Support',color:'var(--support)'},{name:'Interne',color:'var(--interne)'}])}
      ${stackedChart(m, [
        {name:'Productif', values:D.charge.prod, color:'var(--prod)'},
        {name:'Support', values:D.charge.support, color:'var(--support)'},
        {name:'Interne', values:D.charge.interne, color:'var(--interne)'},
      ], {fmt:v=>Math.round(v)+'h', tip:v=>Math.round(v)+' h'})}
    </div></div>`;

  /* 4. Backlog */
  html += `<div class="section"><div class="section-head">
    <h2>Backlog (début de mois)</h2><span class="note">restant à reconnaître</span></div>
    <div class="card">
      ${lineChart(m, [{name:'Backlog', values:D.backlog, color:'var(--geodp)'}], {fmt:eurK, tip:eur})}
    </div></div>`;

  /* 5. Clôtures */
  const cm = D.clotures_mois.length ? D.clotures_mois : m;
  html += `<div class="section"><div class="section-head">
    <h2>Clôtures par mois</h2><span class="note">projets terminés · dont rework</span></div>
    <div class="card">
      ${legend([{name:'Projets clôturés',color:'var(--litt)'},{name:'dont Rework',color:'var(--bad)'}])}
      ${barChart(cm, [
        {name:'Projets', values:D.clotures.projets, color:'var(--litt)'},
        {name:'Rework', values:D.clotures.rework, color:'var(--bad)'},
      ], {fmt:v=>Math.round(v), tip:v=>Math.round(v)})}
    </div></div>`;

  /* Tableau récap */
  let rows = '';
  m.forEach((mois, i) => {
    const cmd = D.commandes[i]||0, ca = D.ca.global[i]||0;
    const rap = D.rapport[i], rapCum = D.rapport_cum[i];
    const rapCls = rap > 1 ? 'rapport-high' : (rap>0 && rap<1 ? 'rapport-low':'');
    rows += `<tr>
      <td>${mois}</td>
      <td>${eur(ca)}</td>
      <td>${eur(cmd)}</td>
      <td class="${rapCls}">${rap||'—'}</td>
      <td>${rapCum||'—'}</td>
      <td>${Math.round((D.charge.prod[i]||0)+(D.charge.support[i]||0)+(D.charge.interne[i]||0))} h</td>
      <td>${eur(D.backlog[i]||0)}</td>
      <td>${D.clotures.projets[i]??'—'} / ${D.clotures.rework[i]??'—'}</td>
    </tr>`;
  });
  html += `<div class="section"><div class="section-head"><h2>Récapitulatif annuel</h2></div>
    <div class="card" style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>Mois</th><th>CA déclaré</th><th>Commandes</th><th>Rapport</th><th>Rapport cumulé</th>
        <th>Charge</th><th>Backlog</th><th>Clôtures / Rework</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;

  document.getElementById('app').innerHTML = html;
}
render();

/* ── Infobulle interactive ── */
(function(){
  const tip = document.getElementById('tooltip');
  const app = document.getElementById('app');
  app.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    const [label, val] = el.getAttribute('data-tip').split('|');
    tip.innerHTML = `<div class="tt-label">${label}</div><div class="tt-val">${val}</div>`;
    tip.classList.add('show');
  });
  app.addEventListener('mousemove', e => {
    if (!tip.classList.contains('show')) return;
    let x = e.clientX + 14, y = e.clientY + 14;
    const r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth) x = e.clientX - r.width - 14;
    if (y + r.height > window.innerHeight) y = e.clientY - r.height - 14;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });
  app.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) tip.classList.remove('show');
  });
})();
</script>
</body>
</html>
